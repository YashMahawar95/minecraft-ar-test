<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kaavya & Yash — AR Experience</title>

<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent!important;
}

body{
font-family:Arial,sans-serif;
}

a-scene{
position:fixed!important;
top:0;
left:0;
width:100%;
height:100%;
background:transparent!important;
}

canvas{
background:transparent!important;
}

/* UI */
#ui{
position:fixed;
inset:0;
z-index:5;
pointer-events:none;
opacity:0;
transition:opacity:1s ease;
}

#ui.show{
opacity:1;
}

#edgeGlow{
position:absolute;
inset:0;
border:1px solid rgba(255,255,255,.10);
box-shadow:
inset 0 0 70px rgba(150,80,255,.08),
inset 0 0 30px rgba(0,220,255,.05);
}

/* CORNERS */
.corner{
position:absolute;
width:75px;
height:75px;
opacity:.6;
}

.tl{
top:20px;
left:20px;
border-top:1px solid rgba(255,255,255,.35);
border-left:1px solid rgba(255,255,255,.35);
border-radius:14px 0 0 0;
}

.tr{
top:20px;
right:20px;
border-top:1px solid rgba(255,255,255,.35);
border-right:1px solid rgba(255,255,255,.35);
border-radius:0 14px 0 0;
}

.bl{
bottom:20px;
left:20px;
border-bottom:1px solid rgba(255,255,255,.35);
border-left:1px solid rgba(255,255,255,.35);
border-radius:0 0 0 14px;
}

.br{
bottom:20px;
right:20px;
border-bottom:1px solid rgba(255,255,255,.35);
border-right:1px solid rgba(255,255,255,.35);
border-radius:0 0 14px 0;
}

/* BRAND */
#brand{
position:absolute;
top:32px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:13px;
letter-spacing:4px;
text-shadow:0 0 12px rgba(180,120,255,.7);
white-space:nowrap;
}

/* START PANEL */
#start-panel{
position:fixed;
z-index:20;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(90%,380px);
padding:28px;
border:1px solid rgba(255,255,255,.25);
border-radius:25px;
background:rgba(20,15,35,.55);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:0 20px 60px rgba(0,0,0,.35);
text-align:center;
color:white;
opacity:1;
transition:opacity:.7s ease,transform:.7s ease;
}

#start-panel.hide{
opacity:0;
transform:translate(-50%,-50%) scale(.96);
pointer-events:none;
}

#start-panel h1{
margin:0 0 8px;
font-size:25px;
}

#start-panel p{
margin:0 0 22px;
opacity:.7;
font-size:14px;
line-height:1.5;
}

#startButton{
padding:14px 28px;
border:1px solid rgba(255,255,255,.4);
border-radius:14px;
background:linear-gradient(135deg,rgba(180,100,255,.8),rgba(40,210,255,.7));
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px rgba(130,100,255,.35);
}

/* LOADING */
#loading-screen{
position:fixed;
inset:0;
z-index:30;
display:flex;
align-items:center;
justify-content:center;
background:transparent!important;
opacity:0;
visibility:hidden;
transition:opacity:.7s ease,visibility:.7s ease;
pointer-events:none;
}

#loading-screen.show{
opacity:1;
visibility:visible;
}

#loading-card{
width:min(85%,340px);
padding:25px;
border:1px solid rgba(255,255,255,.2);
border-radius:22px;
background:rgba(20,15,35,.45);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
color:white;
text-align:center;
transform:translateY(10px) scale(.97);
transition:transform:.7s ease;
}

#loading-screen.show #loading-card{
transform:translateY(0) scale(1);
}

#loader-ring{
width:45px;
height:45px;
margin:0 auto 15px;
border:3px solid rgba(255,255,255,.2);
border-top:3px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

#loading-card h2{
margin:0 0 6px;
font-size:18px;
}

#loading-card p{
margin:0;
font-size:13px;
opacity:.65;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* FLOATING ORBS */
.orb{
position:absolute;
width:12px;
height:12px;
border-radius:50%;
background:rgba(255,255,255,.25);
box-shadow:0 0 18px rgba(150,100,255,.7);
}

.o1{top:17%;left:7%}
.o2{top:27%;right:8%;width:8px;height:8px}
.o3{bottom:20%;left:8%;width:7px;height:7px}
.o4{bottom:13%;right:10%}
</style>
</head>

<body>

<div id="start-panel">
<h1>KAAVYA & YASH</h1>
<p>Bring our invitation to life.<br>Scan the card and discover the surprise.</p>
<button id="startButton">START AR</button>
</div>

<div id="loading-screen">
<div id="loading-card">
<div id="loader-ring"></div>
<h2>Starting AR Experience</h2>
<p>Getting everything ready...</p>
</div>
</div>

<div id="ui">
<div id="edgeGlow"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div id="brand">KAAVYA × YASH</div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>
</div>

<script>
AFRAME.registerComponent('smooth-follow',{
schema:{amount:{type:'number',default:.15}},
init:function(){
this.smoothed=null;
this.smoothedQuat=null;
},
tick:function(){
const obj=this.el.object3D;
if(!this.smoothed){
this.smoothed=obj.position.clone();
this.smoothedQuat=obj.quaternion.clone();
return;
}
this.smoothed.lerp(obj.position,this.data.amount);
this.smoothedQuat.slerp(obj.quaternion,this.data.amount);
obj.position.copy(this.smoothed);
obj.quaternion.copy(this.smoothedQuat);
}
});
</script>

<a-scene
mindar-image="imageTargetSrc:targets.mind;filterMinCF:0.001;filterBeta:10;missTolerance:5;warmupTolerance:5;"
color-space="sRGB"
renderer="colorManagement:true,physicallyCorrectLights,alpha:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
embedded>

<a-assets>
<a-asset-item id="mainModel" src="./model.glb"></a-asset-item>
</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model
src="#mainModel"
position="0 0 0.1"
rotation="90 0 0"
scale="0.5 0.5 0.5"
smooth-follow="amount:0.15">
</a-gltf-model>

</a-entity>

</a-scene>

<script>
const startButton=document.getElementById("startButton");
const startPanel=document.getElementById("start-panel");
const loadingScreen=document.getElementById("loading-screen");
const ui=document.getElementById("ui");

startButton.addEventListener("click",()=>{
startPanel.classList.add("hide");

setTimeout(()=>{
loadingScreen.classList.add("show");
},300);

setTimeout(()=>{
loadingScreen.classList.remove("show");

setTimeout(()=>{
ui.classList.add("show");
},400);

},1800);
});
</script>

</body>
</html>
